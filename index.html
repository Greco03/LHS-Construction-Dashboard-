// ═══ Floating tooltips — rendered at <body> level so they always sit in the
// foreground and can never be clipped by overflow/transform/iframe ancestors ═══
(function(){
  var fl=null, cur=null;
  function ensure(){ if(!fl){ fl=document.createElement('div'); fl.className='tip-float'; document.body.appendChild(fl); } return fl; }
  function position(tip){
    var f=ensure(), src=tip.querySelector('.tiptext'); if(!src) return;
    f.innerHTML=src.innerHTML;
    f.style.display='block'; f.style.left='0px'; f.style.top='0px';
    var tr=tip.getBoundingClientRect();
    var r=f.getBoundingClientRect();
    var vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight, m=12;
    var left=tr.left + tr.width/2 - r.width/2;
    if(left<m) left=m;
    if(left+r.width>vw-m) left=vw-m-r.width;
    var top=tr.bottom+8;                                   // default: below the term
    if(top+r.height>vh-m){                                 // not enough room below?
      var above=tr.top-r.height-8;
      top = above>=m ? above : Math.max(m, vh-m-r.height);  // flip above, else clamp
    }
    f.style.left=left+'px'; f.style.top=top+'px';
    requestAnimationFrame(function(){ f.classList.add('show'); });
  }
  function hide(){ if(fl){ fl.classList.remove('show'); fl.style.display='none'; } cur=null; }
  document.addEventListener('mouseover',function(e){ var t=e.target.closest&&e.target.closest('.tip'); if(t&&t!==cur){ cur=t; position(t); } });
  document.addEventListener('mouseout',function(e){ var t=e.target.closest&&e.target.closest('.tip'); if(t){ var to=e.relatedTarget; if(!to||!t.contains(to)) hide(); } });
  document.addEventListener('focusin',function(e){ var t=e.target.closest&&e.target.closest('.tip'); if(t){ cur=t; position(t); } });
  document.addEventListener('focusout',function(e){ if(e.target.closest&&e.target.closest('.tip')) hide(); });
  window.addEventListener('scroll',hide,true);
  window.addEventListener('resize',hide);
})();
</script>
